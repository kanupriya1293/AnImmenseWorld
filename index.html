<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A growing collection of interactive science visualisations."/>
  <title>An Immense World</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ink: #1a1814;
      --ink-muted: #6b6760;
      --ink-faint: #b0aca6;
      --paper: #faf8f4;
      --paper-warm: #f2ede4;
      --accent: #c8440a;
      --accent-light: #f5ede8;
      --border: rgba(26,24,20,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.8;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    /* ── Header ── */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .site-name {
      font-family: 'DM Mono', monospace;
      font-size: 13px; color: var(--ink-muted);
      letter-spacing: 0.08em; text-transform: uppercase;
      text-decoration: none;
    }

    /* ── Page intro ── */
    .page-intro {
      max-width: 720px; margin: 0 auto;
      padding: 5rem 2rem 3.5rem;
    }
    .page-intro-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 1.25rem;
    }
    .page-intro h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 600; line-height: 1.2;
      color: var(--ink); margin-bottom: 1rem;
    }
    .page-intro p {
      font-size: 1.05rem; color: var(--ink-muted);
      max-width: 520px; line-height: 1.75;
    }

    /* ── Article list ── */
    .article-list {
      max-width: 720px; margin: 0 auto;
      padding: 0 2rem 6rem;
      flex: 1;
    }
    .list-rule {
      border: none; border-top: 1px solid var(--border);
      margin-bottom: 2.5rem;
    }

    /* ── Article card ── */
    .article-card {
      display: block; text-decoration: none;
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 1.75rem 2rem;
      margin-bottom: 1rem;
      background: var(--paper);
      transition: border-color 0.18s, background 0.18s;
    }
    .article-card:hover {
      border-color: rgba(200,68,10,0.3);
      background: var(--accent-light);
    }
    .card-top {
      display: flex; align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .card-num {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--accent);
      letter-spacing: 0.08em;
    }
    .card-tags {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--ink-faint);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem; font-weight: 600;
      color: var(--ink); line-height: 1.3;
      margin-bottom: 0.6rem;
    }
    .card-excerpt {
      font-size: 0.95rem; color: var(--ink-muted);
      line-height: 1.65; margin-bottom: 1.25rem;
    }
    .card-cta {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--accent);
      letter-spacing: 0.06em;
    }

    /* ── Footer ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .footer-name {
      font-family: 'Playfair Display', serif;
      font-size: 14px; color: var(--ink-muted);
      font-style: italic;
    }
    .footer-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px; color: var(--ink-faint);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="/" class="site-name">An Immense World</a>
</header>

<div class="page-intro">
  <div class="page-intro-label">All articles</div>
  <h1>Things worth<br>looking closer at.</h1>
  <p>A growing collection of ideas from books, papers, and curiosity — reconstructed into something you can see and play with.</p>
</div>

<div class="article-list" id="article-list">
  <hr class="list-rule"/>
  <!-- Cards are injected here by articles.js -->
</div>

<footer class="site-footer">
  <span class="footer-name">Kanupriya Agarwal</span>
</footer>

<script src="assets/js/articles.js"></script>
<script>
  const list = document.getElementById('article-list');
  ARTICLES.forEach(a => {
    const card = document.createElement('a');
    card.className = 'article-card';
    card.href = a.url;
    card.innerHTML = `
      <div class="card-top">
        <span class="card-num">${a.num}</span>
        <span class="card-tags">${a.tags.join(' · ')}</span>
      </div>
      <h2 class="card-title">${a.title}</h2>
      <p class="card-excerpt">${a.excerpt}</p>
      <span class="card-cta">Read →</span>
    `;
    list.appendChild(card);
  });
</script>

</body>
</html>
